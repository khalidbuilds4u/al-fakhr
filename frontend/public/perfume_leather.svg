<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <rect width="400" height="600" fill="#111111"/>
  <!-- Bottle body -->
  <rect x="120" y="200" width="160" height="300" rx="5" fill="#000000" stroke="#555555" stroke-width="2"/>
  <!-- Cap -->
  <circle cx="200" cy="140" r="40" fill="#222222" stroke="#444444" stroke-width="2"/>
  <!-- Neck -->
  <rect x="185" y="180" width="30" height="20" fill="#333333"/>
  <!-- Label -->
  <rect x="140" y="300" width="120" height="120" fill="#111111" stroke="#d4af37" stroke-width="1"/>
  <text x="200" y="350" font-family="serif" font-size="18" fill="#ffffff" text-anchor="middle">TUSCAN</text>
  <text x="200" y="375" font-family="serif" font-size="18" fill="#ffffff" text-anchor="middle">LEATHER</text>
</svg>
