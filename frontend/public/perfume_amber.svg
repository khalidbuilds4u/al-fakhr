<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <rect width="400" height="600" fill="#1a1a1a"/>
  <!-- Bottle body -->
  <rect x="100" y="250" width="200" height="250" rx="20" fill="#3a1e12" stroke="#d4af37" stroke-width="2"/>
  <!-- Cap -->
  <rect x="160" y="150" width="80" height="80" fill="#d4af37" rx="5"/>
  <!-- Neck -->
  <rect x="180" y="230" width="40" height="20" fill="#d4af37"/>
  <!-- Label -->
  <rect x="130" y="320" width="140" height="100" fill="transparent" stroke="#d4af37" stroke-width="1"/>
  <text x="200" y="370" font-family="serif" font-size="20" fill="#d4af37" text-anchor="middle">ROYAL</text>
  <text x="200" y="395" font-family="sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">AMBER &amp; SAFFRON</text>
</svg>
