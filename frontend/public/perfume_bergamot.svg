<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <rect width="400" height="600" fill="#0a221c"/>
  <!-- Bottle body -->
  <polygon points="120,480 280,480 320,250 80,250" fill="#ffffff" opacity="0.1" stroke="#d4af37" stroke-width="1"/>
  <polygon points="140,460 260,460 290,270 110,270" fill="#aaccbb" opacity="0.3"/>
  <!-- Cap -->
  <rect x="150" y="150" width="100" height="50" fill="#d4af37" rx="2"/>
  <!-- Neck -->
  <rect x="180" y="200" width="40" height="50" fill="#cccccc"/>
  <!-- Label -->
  <circle cx="200" cy="380" r="50" fill="transparent" stroke="#d4af37" stroke-width="2"/>
  <text x="200" y="375" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">IMPERIAL</text>
  <text x="200" y="395" font-family="serif" font-size="12" fill="#d4af37" text-anchor="middle">BERGAMOT</text>
</svg>
